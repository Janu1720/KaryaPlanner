spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.xciqxkgrvxybnhssulrb
spring.datasource.password=${DB_PASSWORD}

# Hibernate settings (automatically creates tables based on your Java code)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ===============================
# GROQ API CONFIGURATION
# ===============================
groq.api.key=${GROQ_API_KEY}

# Prevent Supabase 15-client limit crashes
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1